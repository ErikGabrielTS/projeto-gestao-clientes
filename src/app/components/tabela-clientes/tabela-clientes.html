@if (loading()) {
  <p>Carregando clientes...</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>CPF</th>
        <th>Data de Nascimento</th>
        <th>Email</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      @for (cliente of clientes(); track cliente.id) {
        <tr>
          <td>{{ cliente.nome }}</td>
          <td>{{ cliente.cpf }}</td>
          <td>{{ cliente.dataNascimento }}</td>
          <td>{{ cliente.email }}</td>
          <td class="actions">
            <div class="action" (click)="modal.onEdit(cliente)">
              <img src="/icons/edit.png" alt="Editar" />
            </div>

            <div class="action" (click)="deleteCliente(cliente.id)">
              <img src="/icons/delete.png" alt="Excluir" />
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="7">Nenhum cliente encontrado.</td>
        </tr>
      }
    </tbody>
  </table>
}

<app-modal-form #modal></app-modal-form>
<app-fab-add></app-fab-add>
