<dialog #dialogElement (close)="closeModal()">
  <form ngNativeValidate (ngSubmit)="onSubmit()">
    <h2>Cadastro de Cliente</h2>

    <div class="form-group">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" [(ngModel)]="formData.nome" required />
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" [(ngModel)]="formData.email" required />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" [(ngModel)]="formData.cpf" required />
      </div>

      <div class="form-group">
        <label for="dataNascimento">Data de Nascimento</label>
        <input
          type="date"
          id="dataNascimento"
          name="dataNascimento"
          [(ngModel)]="formData.dataNascimento"
          required
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="uf">UF</label>

        <select
          id="uf"
          name="uf"
          [(ngModel)]="formData.uf"
          (change)="loadMunicipios(formData.uf?.id ?? undefined)"
          required
        >
          <option [ngValue]="null" selected disabled>Selecione</option>
          @for (estado of estados; track estado.id) {
            <option [ngValue]="estado">{{ estado.sigla }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="municipio">Município</label>
        <select id="municipio" name="municipio" [(ngModel)]="formData.municipio" required>
          <option [ngValue]="null" selected disabled>Selecione</option>
          @for (municipio of municipios; track municipio.id) {
            <option [ngValue]="municipio">{{ municipio.nome }}</option>
          }
        </select>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-secondary" (click)="closeModal()">Cancelar</button>
      <button type="submit" class="btn-primary">
        @if (isEdit) {
          Editar
        } @else {
          Cadastrar
        }
      </button>
    </div>
  </form>
</dialog>
